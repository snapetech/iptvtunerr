name: Publish PPA
run-name: Publish PPA ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.63"
        required: true

permissions:
  contents: read

jobs:
  publish-ppa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: release-ppa-${{ matrix.ubuntu_series }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        ubuntu_series: [jammy, noble]
    steps:
      - name: Resolve version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Require latest release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main --tags
          RELEASE_REPO_DIR="$GITHUB_WORKSPACE" RELEASE_TAG_MAIN_MODE=latest \
            bash -c "$(git show origin/main:scripts/ensure-release-tag-on-main.sh)" release-tag-guard "$TAG"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install packaging tools
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y dpkg-dev dput gnupg curl jq
          elif command -v pacman >/dev/null 2>&1; then
            sudo pacman -Sy --needed --noconfirm dpkg gnupg curl
          elif command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y dpkg-dev gnupg2 curl
          elif command -v yum >/dev/null 2>&1; then
            sudo yum install -y dpkg-dev gnupg2 curl
          elif command -v apk >/dev/null 2>&1; then
            sudo apk add --no-cache dpkg gnupg curl
          else
            echo "No supported package manager found for PPA packaging tools" >&2
            exit 1
          fi

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$GPG_PRIVATE_KEY"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Prepare source package
        id: source
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          series="${{ matrix.ubuntu_series }}"
          src="iptvtunerr-${version}"
          rm -rf "$src"
          mkdir -p "$src/usr/bin" "$src/lib/systemd/system" "$src/etc/iptvtunerr" "$src/usr/lib/sysusers.d" "$src/usr/lib/tmpfiles.d"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=vendor -trimpath -ldflags="-s -w -X main.Version=v${version}" -o "$src/usr/bin/iptv-tunerr" ./cmd/iptv-tunerr
          cp packaging/aur/iptvtunerr.service "$src/lib/systemd/system/"
          cp packaging/aur/iptvtunerr.env "$src/etc/iptvtunerr/"
          cp packaging/aur/iptvtunerr.sysusers "$src/usr/lib/sysusers.d/iptvtunerr.conf"
          cp packaging/aur/iptvtunerr.tmpfiles "$src/usr/lib/tmpfiles.d/iptvtunerr.conf"
          cp -r packaging/debian "$src/debian"
          printf 'usr/bin/iptv-tunerr\n' > "$src/debian/source/include-binaries"
          ppa_rev="$(date -u +%Y%m%d%H%M)"
          ppa_version="${version}+ppa${ppa_rev}~${series}"
          cat > "$src/debian/changelog" <<EOF
          iptvtunerr (${ppa_version}) ${series}; urgency=medium

            * Release ${{ steps.version.outputs.tag }}

           -- snapetech <iptvtunerr@proton.me>  $(date -R)
          EOF
          chmod +x "$src/debian/rules" "$src/debian/postinst"
          echo "ppa_version=${ppa_version}" >> "$GITHUB_OUTPUT"

      - name: Build signed source package
        env:
          PPA_VERSION: ${{ steps.source.outputs.ppa_version }}
        run: |
          set -euo pipefail
          src="iptvtunerr-${{ steps.version.outputs.version }}"
          cd "$src"
          dpkg-source -b .
          cd ..
          dsc="iptvtunerr_${PPA_VERSION}.dsc"
          test -s "$dsc"
          gpg --batch --yes --local-user 07E2531E1F470F8008ACCFC996A07606FE65392F \
            --clearsign --digest-algo SHA512 --output "${dsc}.asc" "$dsc"
          mv "${dsc}.asc" "$dsc"
          gpg --batch --verify "$dsc"

          cd "$src"
          dpkg-genchanges -S -sa -O"../iptvtunerr_${PPA_VERSION}_source.changes"
          cd ..
          changes="iptvtunerr_${PPA_VERSION}_source.changes"
          gpg --batch --yes --local-user 07E2531E1F470F8008ACCFC996A07606FE65392F \
            --clearsign --digest-algo SHA512 --output "${changes}.asc" "$changes"
          mv "${changes}.asc" "$changes"
          gpg --batch --verify "$changes"

      - name: Upload to Launchpad PPA
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main --tags
          RELEASE_REPO_DIR="$PWD" RELEASE_TAG_MAIN_MODE=latest \
            bash -c "$(git show origin/main:scripts/ensure-release-tag-on-main.sh)" release-tag-guard "$TAG"
          changes="$(find . -maxdepth 1 -name '*.changes' -print -quit)"
          test -n "$changes"
          sha256sum "$changes"
          dput "ppa:keefshape/iptvtunerr" "$changes"

      - name: Wait for Launchpad binary publication
        env:
          PPA_VERSION: ${{ steps.source.outputs.ppa_version }}
          UBUNTU_SERIES: ${{ matrix.ubuntu_series }}
        run: |
          set -euo pipefail
          archive="https://api.launchpad.net/1.0/~keefshape/+archive/ubuntu/iptvtunerr"
          series_link="https://api.launchpad.net/1.0/ubuntu/${UBUNTU_SERIES}"
          consecutive_missing_sources=0

          for attempt in $(seq 1 70); do
            source_response="$(curl --fail --silent --show-error --get "$archive" \
              --data-urlencode 'ws.op=getPublishedSources' \
              --data-urlencode 'source_name=iptvtunerr' \
              --data-urlencode "version=${PPA_VERSION}" \
              --data-urlencode "distro_series=${series_link}" \
              --data-urlencode 'exact_match=true' \
              --data-urlencode 'ws.size=10')"
            source_entry="$(jq -c --arg version "$PPA_VERSION" \
              '.entries[]? | select(.source_package_version == $version) | {self_link, status}' \
              <<< "$source_response" | head -n 1)"
            source_link="$(jq -r '.self_link // empty' <<< "${source_entry:-null}")"
            source_status="$(jq -r '.status // empty' <<< "${source_entry:-null}")"

            if [[ -z "$source_link" ]]; then
              consecutive_missing_sources=$((consecutive_missing_sources + 1))
              if (( consecutive_missing_sources >= 20 )); then
                echo "Launchpad has no source publication record for ${PPA_VERSION} (${UBUNTU_SERIES}); inspect its upload queue/rejection notice." >&2
                exit 1
              fi
              echo "Waiting for Launchpad to accept ${PPA_VERSION} for ${UBUNTU_SERIES} (${attempt}/70)."
              sleep 30
              continue
            fi
            consecutive_missing_sources=0
            if [[ "$source_status" == "Superseded" || "$source_status" == "Deleted" ]]; then
              echo "Launchpad reports source ${PPA_VERSION} as ${source_status} for ${UBUNTU_SERIES}." >&2
              exit 1
            fi

            build_response="$(curl --fail --silent --show-error --get "$source_link" \
              --data-urlencode 'ws.op=getBuilds' \
              --data-urlencode 'ws.size=20')"
            build_entry="$(jq -c '[.entries[]? | select(.arch_tag == "amd64")][0] // {}' \
              <<< "$build_response")"
            build_state="$(jq -r '.buildstate // empty' <<< "$build_entry")"
            build_link="$(jq -r '.self_link // empty' <<< "$build_entry")"
            build_log="$(jq -r '.build_log_url // empty' <<< "$build_entry")"
            if [[ "$build_state" == "Failed to build" || "$build_state" == "Failed to upload" || \
              "$build_state" == "Chroot problem" || "$build_state" == "Build for superseded Source" || \
              "$build_state" == "Cancelled build" ]]; then
              echo "Launchpad amd64 build failed (${build_state}): ${build_link} ${build_log}" >&2
              exit 1
            fi

            binary_response="$(curl --fail --silent --show-error --get "$source_link" \
              --data-urlencode 'ws.op=getPublishedBinaries' \
              --data-urlencode 'active_binaries_only=false' \
              --data-urlencode 'ws.size=10')"
            binary_status="$(jq -r --arg version "$PPA_VERSION" \
              '.entries[]? | select(.binary_package_name == "iptvtunerr" and .binary_package_version == $version and (.distro_arch_series_link | endswith("/amd64"))) | .status' \
              <<< "$binary_response" | head -n 1)"

            if [[ "$source_status" == "Published" && "$binary_status" == "Published" ]]; then
              echo "Launchpad published binary ${PPA_VERSION} for ${UBUNTU_SERIES}/amd64."
              exit 0
            fi
            if [[ "$binary_status" == "Superseded" || "$binary_status" == "Deleted" || "$binary_status" == "Obsolete" ]]; then
              echo "Launchpad reports binary ${PPA_VERSION} as ${binary_status} for ${UBUNTU_SERIES}/amd64." >&2
              exit 1
            fi

            echo "Launchpad source is ${source_status}; amd64 build is ${build_state:-pending}; waiting for binary publication (${attempt}/70)."
            sleep 60
          done

          echo "Launchpad did not publish binary ${PPA_VERSION} for ${UBUNTU_SERIES}/amd64 after 70 checks. Inspect ${build_link:-the source build record} ${build_log:-}." >&2
          exit 1
