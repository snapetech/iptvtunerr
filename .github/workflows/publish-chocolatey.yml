name: Publish Chocolatey

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish, for example v0.1.85"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish Chocolatey
    runs-on: [self-hosted, Linux, X64, iptvtunerr]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: "8.x"

      - name: Require release tag on main
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.version }}"
          git fetch --quiet origin main --tags
          git rev-parse -q --verify "refs/tags/${tag}" >/dev/null
          tag_commit="$(git rev-list -n 1 "${tag}")"
          main_commit="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "[publish-chocolatey] ERROR: release tag '${tag}' points to ${tag_commit}, which is not in origin/main history" >&2
            exit 1
          fi
          echo "[publish-chocolatey] ${tag} is in origin/main history (${tag_commit}; current main ${main_commit})"

      - name: Download Windows release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          asset="iptv-tunerr-${{ inputs.version }}-windows-amd64.zip"
          download_dir="${RUNNER_TEMP}/chocolatey-assets"
          mkdir -p "${download_dir}"
          rm -f "${download_dir}/${asset}"
          url="https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/${asset}"
          auth_header=()
          if [[ -n "${GH_TOKEN:-}" ]]; then
            auth_header=(-H "Authorization: Bearer ${GH_TOKEN}")
          fi
          curl --fail --location --show-error --silent \
            --connect-timeout 20 \
            --max-time 180 \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            --output "${download_dir}/${asset}" \
            "${auth_header[@]}" \
            "${url}"
          test -s "${download_dir}/${asset}"

      - name: Prepare Chocolatey package
        id: pack
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          command -v dotnet >/dev/null
          command -v sha256sum >/dev/null
          command -v unzip >/dev/null
          command -v zip >/dev/null

          version="${{ inputs.version }}"
          package_version="${version#v}"
          asset="iptv-tunerr-${version}-windows-amd64.zip"
          asset_path="${RUNNER_TEMP}/chocolatey-assets/${asset}"
          test -s "${asset_path}"
          url="https://github.com/${{ github.repository }}/releases/download/${version}/${asset}"
          checksum="$(sha256sum "${asset_path}" | awk '{print $1}')"
          project_url="https://github.com/${{ github.repository }}"
          icon_url="https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/docs/assets/iptvtunerr-icon.svg"
          package_source_url="${project_url}/tree/main/packaging/chocolatey"
          docs_url="${project_url}/blob/main/docs/index.md"
          bug_tracker_url="${project_url}/issues"
          release_notes="${project_url}/releases/tag/${version}"

          cat > packaging/chocolatey/iptvtunerr.nuspec <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2015/06/nuspec.xsd">
            <metadata>
              <id>iptvtunerr</id>
              <version>${package_version}</version>
              <title>IPTV Tunerr</title>
              <authors>snapetech</authors>
              <owners>slskdn</owners>
              <projectUrl>${project_url}</projectUrl>
              <iconUrl>${icon_url}</iconUrl>
              <licenseUrl>${project_url}/blob/main/LICENSE</licenseUrl>
              <packageSourceUrl>${package_source_url}</packageSourceUrl>
              <projectSourceUrl>${project_url}</projectSourceUrl>
              <docsUrl>${docs_url}</docsUrl>
              <bugTrackerUrl>${bug_tracker_url}</bugTrackerUrl>
              <releaseNotes>${release_notes}</releaseNotes>
              <requireLicenseAcceptance>false</requireLicenseAcceptance>
              <tags>iptv plex emby jellyfin hdhomerun xmltv live-tv dvr</tags>
              <summary>IPTV to Plex, Emby, and Jellyfin bridge</summary>
              <description>IPTV Tunerr turns IPTV sources into a stable HDHomeRun-style tuner and XMLTV guide surface for Plex, Emby, and Jellyfin.</description>
            </metadata>
            <files>
              <file src="tools\**" target="tools" />
            </files>
          </package>
          EOF

          cat > packaging/chocolatey/tools/chocolateyinstall.ps1 <<EOF
          \$toolsDir = "\$(Split-Path -parent \$MyInvocation.MyCommand.Definition)"
          \$releaseTag = "${version}"
          \$url = "${url}"
          \$checksum = "${checksum}"

          Install-ChocolateyZipPackage -PackageName 'iptvtunerr' -Url \$url -UnzipLocation \$toolsDir -Checksum \$checksum -ChecksumType 'sha256'

          \$exe = Join-Path \$toolsDir "iptv-tunerr-\$releaseTag-windows-amd64\iptv-tunerr.exe"
          if (-not (Test-Path \$exe)) {
              throw "Expected executable was not found: \$exe"
          }

          Install-BinFile -Name "iptv-tunerr" -Path \$exe
          EOF

          pack_root="${RUNNER_TEMP}/iptvtunerr-chocolatey-pack-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pack_out="${pack_root}/out"
          pack_project="${pack_root}/pack.csproj"
          rm -rf "${pack_root}"
          mkdir -p "${pack_out}"
          cat > "${pack_project}" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <NuspecFile>${PWD}/packaging/chocolatey/iptvtunerr.nuspec</NuspecFile>
              <NuspecBasePath>${PWD}/packaging/chocolatey</NuspecBasePath>
              <IncludeBuildOutput>false</IncludeBuildOutput>
              <SuppressDependenciesWhenPacking>true</SuppressDependenciesWhenPacking>
            </PropertyGroup>
          </Project>
          EOF

          echo "[publish-chocolatey] Packing Chocolatey package ${package_version}"
          timeout 180 dotnet pack "${pack_project}" --configuration Release --output "${pack_out}"
          nupkg="${pack_out}/iptvtunerr.${package_version}.nupkg"
          test -s "${nupkg}"

          echo "[publish-chocolatey] Preserving exact Chocolatey nuspec in $(basename "${nupkg}")"
          zip -q -j "${nupkg}" packaging/chocolatey/iptvtunerr.nuspec

          echo "[publish-chocolatey] Checking packed nuspec metadata"
          packed_nuspec="$(unzip -p "${nupkg}" iptvtunerr.nuspec)"
          for required_tag in packageSourceUrl projectSourceUrl docsUrl bugTrackerUrl releaseNotes iconUrl; do
            if ! grep -q "<${required_tag}>" <<<"${packed_nuspec}"; then
              echo "Packed Chocolatey nuspec is missing <${required_tag}>" >&2
              exit 1
            fi
          done
          echo "nupkg=${nupkg}" >> "${GITHUB_OUTPUT}"

      - name: Push Chocolatey package
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          if [[ -z "${CHOCO_API_KEY:-}" ]]; then
            echo "CHOCO_API_KEY secret is not configured" >&2
            exit 1
          fi
          nupkg="${{ steps.pack.outputs.nupkg }}"
          test -s "${nupkg}"
          echo "[publish-chocolatey] Pushing $(basename "${nupkg}") to Chocolatey"
          timeout 300 dotnet nuget push "${nupkg}" --source https://push.chocolatey.org/ --api-key "${CHOCO_API_KEY}" --timeout 300 --skip-duplicate
          echo "[publish-chocolatey] Chocolatey push completed"
