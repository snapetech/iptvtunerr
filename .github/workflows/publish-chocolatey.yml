name: Publish Chocolatey

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish, for example v0.1.85"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish Chocolatey
    runs-on: [self-hosted, Linux, X64, iptvtunerr]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: "8.x"

      - name: Require release tag on main
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.version }}"
          git fetch --quiet origin main --tags
          git rev-parse -q --verify "refs/tags/${tag}" >/dev/null
          tag_commit="$(git rev-list -n 1 "${tag}")"
          main_commit="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "[publish-chocolatey] ERROR: release tag '${tag}' points to ${tag_commit}, which is not in origin/main history" >&2
            exit 1
          fi
          echo "[publish-chocolatey] ${tag} is in origin/main history (${tag_commit}; current main ${main_commit})"

      - name: Download Windows release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          asset="iptv-tunerr-${{ inputs.version }}-windows-amd64.zip"
          download_dir="${RUNNER_TEMP}/chocolatey-assets"
          mkdir -p "${download_dir}"
          rm -f "${download_dir}/${asset}"
          url="https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/${asset}"
          auth_header=()
          if [[ -n "${GH_TOKEN:-}" ]]; then
            auth_header=(-H "Authorization: Bearer ${GH_TOKEN}")
          fi
          curl --fail --location --show-error --silent \
            --connect-timeout 20 \
            --max-time 180 \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            --output "${download_dir}/${asset}" \
            "${auth_header[@]}" \
            "${url}"
          test -s "${download_dir}/${asset}"

      - name: Pack and push
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:CHOCO_API_KEY)) {
            Write-Error "CHOCO_API_KEY secret is not configured"
            exit 1
          }
          if (-not (Get-Command dotnet -ErrorAction SilentlyContinue)) {
            Write-Error "dotnet is required to pack and push the Chocolatey package"
            exit 1
          }
          if (-not (Get-Command timeout -ErrorAction SilentlyContinue)) {
            Write-Error "timeout is required to bound dotnet pack/push"
            exit 1
          }

          $Version = "${{ inputs.version }}"
          $PackageVersion = $Version.TrimStart("v")
          $Asset = "iptv-tunerr-$Version-windows-amd64.zip"
          $AssetPath = Join-Path (Join-Path $env:RUNNER_TEMP "chocolatey-assets") $Asset
          if (-not (Test-Path $AssetPath)) {
            Write-Error "Release asset was not found: $AssetPath"
            exit 1
          }
          $Url = "https://github.com/${{ github.repository }}/releases/download/$Version/$Asset"
          $Checksum = (Get-FileHash $AssetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $ReleaseNotes = "https://github.com/${{ github.repository }}/releases/tag/$Version"
          $IconUrl = "https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/docs/assets/iptvtunerr-icon.svg"
          $ProjectUrl = "https://github.com/${{ github.repository }}"
          $PackageSourceUrl = "$ProjectUrl/tree/main/packaging/chocolatey"
          $DocsUrl = "$ProjectUrl/blob/main/docs/index.md"
          $BugTrackerUrl = "$ProjectUrl/issues"

          @"
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2015/06/nuspec.xsd">
            <metadata>
              <id>iptvtunerr</id>
              <version>$PackageVersion</version>
              <title>IPTV Tunerr</title>
              <authors>snapetech</authors>
              <owners>slskdn</owners>
              <projectUrl>$ProjectUrl</projectUrl>
              <iconUrl>$IconUrl</iconUrl>
              <licenseUrl>$ProjectUrl/blob/main/LICENSE</licenseUrl>
              <packageSourceUrl>$PackageSourceUrl</packageSourceUrl>
              <projectSourceUrl>$ProjectUrl</projectSourceUrl>
              <docsUrl>$DocsUrl</docsUrl>
              <bugTrackerUrl>$BugTrackerUrl</bugTrackerUrl>
              <releaseNotes>$ReleaseNotes</releaseNotes>
              <requireLicenseAcceptance>false</requireLicenseAcceptance>
              <tags>iptv plex emby jellyfin hdhomerun xmltv live-tv dvr</tags>
              <summary>IPTV to Plex, Emby, and Jellyfin bridge</summary>
              <description>IPTV Tunerr turns IPTV sources into a stable HDHomeRun-style tuner and XMLTV guide surface for Plex, Emby, and Jellyfin.</description>
            </metadata>
            <files>
              <file src="tools\**" target="tools" />
            </files>
          </package>
          "@ | Set-Content -Encoding UTF8 packaging/chocolatey/iptvtunerr.nuspec

          @"
          `$toolsDir = "`$(Split-Path -parent `$MyInvocation.MyCommand.Definition)"
          `$releaseTag = "$Version"
          `$url = "$Url"
          `$checksum = "$Checksum"

          Install-ChocolateyZipPackage -PackageName 'iptvtunerr' -Url `$url -UnzipLocation `$toolsDir -Checksum `$checksum -ChecksumType 'sha256'

          `$exe = Join-Path `$toolsDir "iptv-tunerr-`$releaseTag-windows-amd64\iptv-tunerr.exe"
          if (-not (Test-Path `$exe)) {
              throw "Expected executable was not found: `$exe"
          }

          Install-BinFile -Name "iptv-tunerr" -Path `$exe
          "@ | Set-Content -Encoding UTF8 packaging/chocolatey/tools/chocolateyinstall.ps1

          $PackageDir = Resolve-Path packaging/chocolatey
          $PackRoot = Join-Path $env:RUNNER_TEMP ("iptvtunerr-chocolatey-pack-" + [Guid]::NewGuid().ToString("N"))
          $PackProject = Join-Path $PackRoot "pack.csproj"
          $PackOut = Join-Path $PackRoot "out"
          New-Item -ItemType Directory -Force -Path $PackOut | Out-Null
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <NuspecFile>$($PackageDir.Path)/iptvtunerr.nuspec</NuspecFile>
              <NuspecBasePath>$($PackageDir.Path)</NuspecBasePath>
              <IncludeBuildOutput>false</IncludeBuildOutput>
              <SuppressDependenciesWhenPacking>true</SuppressDependenciesWhenPacking>
            </PropertyGroup>
          </Project>
          "@ | Set-Content -Encoding UTF8 $PackProject

          Write-Host "[publish-chocolatey] Packing Chocolatey package $PackageVersion"
          & timeout 180 dotnet pack $PackProject --configuration Release --output $PackOut
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet pack failed or timed out with exit code $LASTEXITCODE"
          }
          $nupkg = Get-ChildItem $PackOut -Filter "iptvtunerr.$PackageVersion.nupkg" | Select-Object -First 1
          if (-not $nupkg) {
            Write-Error "No .nupkg file found"
            exit 1
          }

          Write-Host "[publish-chocolatey] Preserving exact Chocolatey nuspec in $($nupkg.Name)"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $NuspecPath = Resolve-Path packaging/chocolatey/iptvtunerr.nuspec
          $Archive = [System.IO.Compression.ZipFile]::Open($nupkg.FullName, [System.IO.Compression.ZipArchiveMode]::Update)
          try {
            $ExistingNuspec = $Archive.GetEntry("iptvtunerr.nuspec")
            if (-not $ExistingNuspec) {
              throw "Packed Chocolatey package did not contain iptvtunerr.nuspec"
            }
            $ExistingNuspec.Delete()
            [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($Archive, $NuspecPath.Path, "iptvtunerr.nuspec") | Out-Null
          } finally {
            if ($Archive) {
              $Archive.Dispose()
            }
          }

          $Archive = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
          try {
            $PackedNuspecEntry = $Archive.GetEntry("iptvtunerr.nuspec")
            if (-not $PackedNuspecEntry) {
              throw "Packed Chocolatey package did not contain iptvtunerr.nuspec after replacement"
            }
            $Reader = [System.IO.StreamReader]::new($PackedNuspecEntry.Open())
            try {
              $PackedNuspec = $Reader.ReadToEnd()
            } finally {
              $Reader.Dispose()
            }
          } finally {
            $Archive.Dispose()
          }

          foreach ($RequiredTag in @("packageSourceUrl", "projectSourceUrl", "docsUrl", "bugTrackerUrl", "releaseNotes", "iconUrl")) {
            if ($PackedNuspec -notmatch "<$RequiredTag>") {
              throw "Packed Chocolatey nuspec is missing <$RequiredTag>"
            }
          }
          Write-Host "[publish-chocolatey] Packed nuspec metadata check passed"

          Write-Host "[publish-chocolatey] Pushing $($nupkg.Name) to Chocolatey"
          & timeout 300 dotnet nuget push $nupkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY --timeout 300 --skip-duplicate
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet nuget push failed or timed out with exit code $LASTEXITCODE"
          }
          Write-Host "[publish-chocolatey] Chocolatey push completed"
