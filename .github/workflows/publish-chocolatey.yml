name: Publish Chocolatey

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish, for example v0.1.85"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish Chocolatey
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Require release tag on main
        shell: bash
        env:
          RELEASE_TAG_MAIN_MODE: ancestor
        run: ./scripts/ensure-release-tag-on-main.sh "${{ inputs.version }}"

      - name: Download Windows release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release download "${{ inputs.version }}" `
            --repo ${{ github.repository }} `
            --pattern "iptv-tunerr-${{ inputs.version }}-windows-amd64.zip"

      - name: Pack and push
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:CHOCO_API_KEY)) {
            Write-Error "CHOCO_API_KEY secret is not configured"
            exit 1
          }

          $Version = "${{ inputs.version }}"
          $PackageVersion = $Version.TrimStart("v")
          $Asset = "iptv-tunerr-$Version-windows-amd64.zip"
          $Url = "https://github.com/${{ github.repository }}/releases/download/$Version/$Asset"
          $Checksum = (Get-FileHash $Asset -Algorithm SHA256).Hash.ToLowerInvariant()
          $ReleaseNotes = "https://github.com/${{ github.repository }}/releases/tag/$Version"
          $IconUrl = "https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/docs/assets/iptvtunerr-icon.svg"
          $ProjectUrl = "https://github.com/${{ github.repository }}"
          $PackageSourceUrl = "$ProjectUrl/tree/main/packaging/chocolatey"
          $DocsUrl = "$ProjectUrl/blob/main/docs/index.md"
          $BugTrackerUrl = "$ProjectUrl/issues"

          @"
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2015/06/nuspec.xsd">
            <metadata>
              <id>iptvtunerr</id>
              <version>$PackageVersion</version>
              <title>IPTV Tunerr</title>
              <authors>snapetech</authors>
              <owners>slskdn</owners>
              <projectUrl>$ProjectUrl</projectUrl>
              <iconUrl>$IconUrl</iconUrl>
              <licenseUrl>$ProjectUrl/blob/main/LICENSE</licenseUrl>
              <packageSourceUrl>$PackageSourceUrl</packageSourceUrl>
              <projectSourceUrl>$ProjectUrl</projectSourceUrl>
              <docsUrl>$DocsUrl</docsUrl>
              <bugTrackerUrl>$BugTrackerUrl</bugTrackerUrl>
              <releaseNotes>$ReleaseNotes</releaseNotes>
              <requireLicenseAcceptance>false</requireLicenseAcceptance>
              <tags>iptv plex emby jellyfin hdhomerun xmltv live-tv dvr</tags>
              <summary>IPTV to Plex, Emby, and Jellyfin bridge</summary>
              <description>IPTV Tunerr turns IPTV sources into a stable HDHomeRun-style tuner and XMLTV guide surface for Plex, Emby, and Jellyfin.</description>
            </metadata>
            <files>
              <file src="tools\**" target="tools" />
            </files>
          </package>
          "@ | Set-Content -Encoding UTF8 packaging/chocolatey/iptvtunerr.nuspec

          @"
          `$toolsDir = "`$(Split-Path -parent `$MyInvocation.MyCommand.Definition)"
          `$releaseTag = "$Version"
          `$url = "$Url"
          `$checksum = "$Checksum"

          Install-ChocolateyZipPackage -PackageName 'iptvtunerr' -Url `$url -UnzipLocation `$toolsDir -Checksum `$checksum -ChecksumType 'sha256'

          `$exe = Join-Path `$toolsDir "iptv-tunerr-`$releaseTag-windows-amd64\iptv-tunerr.exe"
          if (-not (Test-Path `$exe)) {
              throw "Expected executable was not found: `$exe"
          }

          Install-BinFile -Name "iptv-tunerr" -Path `$exe
          "@ | Set-Content -Encoding UTF8 packaging/chocolatey/tools/chocolateyinstall.ps1

          cd packaging/chocolatey
          choco pack
          $nupkg = Get-ChildItem -Filter "*.nupkg" | Select-Object -First 1
          if (-not $nupkg) {
            Write-Error "No .nupkg file found"
            exit 1
          }
          choco push $nupkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY --execution-timeout 300
